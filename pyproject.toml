[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "oidc-hunter"
version = "0.1.0"
description = "An autonomous agent that discovers public OpenID Connect endpoints, verifies them, and maintains a reviewable candidate set for catalog inclusion."
readme = "README.md"
requires-python = ">=3.14" # PYTHONVERSION
dependencies = [
    "google-adk[extensions]>=1.0.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]
