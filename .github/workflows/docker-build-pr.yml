name: Validate Docker Images

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Generate SBOM
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --tag oidc-hunter:test
          --attest type=sbom
          --output "type=local,dest=${RUNNER_TEMP}/sbom-export"
          .

      - name: Build image
        run: >-
          docker buildx build
          --platform linux/${{ matrix.arch }}
          --tag oidc-hunter:test
          --sbom=false
          --provenance=false
          --load
          .

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oidc-hunter-sbom-${{ matrix.arch }}
          path: ${{ runner.temp }}/sbom-export/sbom.spdx.json
          if-no-files-found: error

      - name: Verify native dependency imports
        run: docker run --rm --entrypoint python oidc-hunter:test -c "import cffi, zstandard; import oidc_hunter.adk_app"

      - name: Run tests in the runtime image
        run: docker run --rm --volume "${GITHUB_WORKSPACE}/tests:/app/tests:ro" --entrypoint python oidc-hunter:test -m unittest discover
